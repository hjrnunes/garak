name: Fold CI

# CI for the integration branch of this fork. NVIDIA's own workflows already run
# on every pull request, whatever its base branch. This workflow adds what they
# lack: runs on pushes to fold/main, a sign-off check, a docs gate, and a job
# that installs the optional extras.

on:
  push:
    branches:
      - 'fold/main'
  pull_request:
    branches:
      - 'fold/main'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  XDG_CACHE_HOME: ${{ github.workspace }}/.cache
  # pyproject extras that the fork adds beyond requirements.txt, comma separated
  FOLD_EXTRAS: "midojo,midojo-mim"
  # tests that need those extras, space separated
  FOLD_EXTRAS_TESTS: "tests/evidence tests/injectors tests/environments"
  # pip requirement specifiers, space separated, that pin the source of an extra no index serves; the owner sets it when the pins are set
  FOLD_EXTRA_SOURCES: ""

jobs:
  signoff:
    name: Commit sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Require a Signed-off-by trailer on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}"); do
            if ! git log -1 --format=%B "$sha" | git interpret-trailers --parse | grep -Eq '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit $sha has no Signed-off-by trailer; amend it with git commit -s"
              status=1
            fi
          done
          exit $status

  suite:
    name: NVIDIA suite
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/test_linux.yml

  docs:
    name: Docs tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir -r docs/requirements-docs.txt
      - name: Test that every plugin module is documented
        run: python -m pytest tests/test_docs.py
      - name: Build documentation
        run: |
          cd docs/source
          python -m sphinx -T -E -b html -d _build/doctrees -D language=en -W ./ html

  extras:
    name: Extras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
      - name: Install pinned sources of the fork extras
        if: env.FOLD_EXTRA_SOURCES != ''
        run: pip install --no-cache-dir ${FOLD_EXTRA_SOURCES}
      - name: Install the package with the fork extras
        run: pip install --no-cache-dir -e ".[tests${FOLD_EXTRAS:+,${FOLD_EXTRAS}}]"
      - name: Check the installed command
        run: |
          garak --version
          garak --list_generators > /dev/null
      - name: Test the extras
        if: env.FOLD_EXTRAS_TESTS != ''
        run: python -m pytest ${FOLD_EXTRAS_TESTS}
